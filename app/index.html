<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neoflo · B2B Cash Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/design_tokens.css" />
  <link rel="stylesheet" href="assets/css/strategy-surface.tokens.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">N</div>
        <div class="sidebar__brandtext">
          <div class="sidebar__brandname">Neoflo</div>
          <div class="sidebar__brandsub">Cash Application</div>
        </div>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav"><!-- nav injected by app.js --></nav>
      <div class="sidebar__foot">
        <div class="sidebar__entity">
          <span class="sidebar__entity-label">Entity</span>
          <span class="sidebar__entity-value">Grab Ads SG</span>
        </div>
        <div class="sidebar__user">
          <div class="avatar">SS</div>
          <div class="sidebar__user-meta">
            <div class="sidebar__user-name">Shubham S.</div>
            <div class="sidebar__user-role">Cash-app analyst</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar" id="topbar"><!-- topbar injected per view --></header>
      <main class="content" id="content"><!-- view rendered here --></main>
    </div>
  </div>

  <!-- Comment / review layer (temporary, removable) -->
  <div id="review-layer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/comments.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
